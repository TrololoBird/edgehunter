<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Microstructure Scanner</title>
<link rel="stylesheet" href="/static/style.css">
<!-- served locally (no CDN = no charts before); the CDN only as a fallback -->
<script src="/static/lightweight-charts.4.2.0.js"></script>
<script>window.LightweightCharts || document.write('<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"><\/script>')</script>
</head>
<body>
<header id="top">
  <div class="brand">Microstructure&nbsp;Scanner <span id="conn" class="dot off" title="связь с ботом"></span></div>
  <div id="market" class="market"></div>
  <div id="status" class="status"></div>
  <button id="notify" class="ghost" title="уведомления браузера о новых сделках">🔕</button>
  <button id="theme" class="ghost" title="тема">◐</button>
</header>
<nav id="tabs">
  <button data-tab="trade">В сделке <b id="n-trade">0</b></button>
  <button data-tab="wait">Ожидают <b id="n-wait">0</b></button>
  <button data-tab="done">Завершённые <b id="n-done">0</b></button>
  <button data-tab="anom">Аномалии <b id="n-anom">0</b></button>
  <button data-tab="forming">Формируются <b id="n-forming">0</b></button>
  <button data-tab="stats">Статистика</button>
  <button data-tab="health">Здоровье</button>
</nav>
<main id="view"></main>
<aside id="drawer" class="hidden">
  <div class="drawer-head">
    <div id="d-title"></div>
    <div class="drawer-tools">
      <button data-tf="1440" class="tf" title="дневные свечи, собранные из часовых (история 1h)">1d</button>
      <button data-tf="240" class="tf" title="4h свечи, собранные из часовых">4h</button>
      <button data-tf="60" class="tf">1h</button>
      <button data-tf="15" class="tf active">15m</button>
      <button data-tf="5" class="tf">5m</button>
      <label class="heat-toggle" title="метки журнала на свечах: аномалии, сетапы, карточки (входы видны всегда)"><input type="checkbox" id="ev-on"> события</label>
      <label class="heat-toggle" title="только у карточки продолжения: сетка Фибоначчи: импульс A→B, коррекция до C, зона OTE 0.62–0.79, цели — расширение по тренду 1.0 / 1.2 / 1.272 / 1.618 от C"><input type="checkbox" id="fib-on" checked> фибо</label>
      <label class="heat-toggle" title="история стакана: локальная книга по потоку изменений Binance, снимок раз в 30с, только горячие монеты (до 25). Это прошлое: где стояла ликвидность в момент каждой свечи, а не где она стоит сейчас. Линии «плотн.» — устойчивые полосы, которые бот берёт в карту уровней"><input type="checkbox" id="heat-on" checked> стакан</label>
      <label class="heat-toggle" title="выключено: только сильное устойчивое тепло - корзина держит ≥ 4× медианы своего бара в ≥ 3 барах окна (как полосы ликвидности бота); включено: вся история стакана"><input type="checkbox" id="heat-all"> всё тепло</label>
      <label class="heat-toggle" title="под свечами: открытый интерес (жёлтый) и накопленная дельта агрессивных покупок/продаж по 15m свечам — фьючерсы (голубой) и спот (фиолетовый), с начала видимого окна"><input type="checkbox" id="flow-on" checked> OI/CVD</label>
      <label class="heat-toggle" title="выключено: по 4 сильнейших зоны (сила ≥ 2) сверху и снизу цены в пределах графика; включено: до 12 на сторону, слабые тоже"><input type="checkbox" id="lv-all"> все уровни</label>
      <button id="d-shot" class="ghost" title="сохранить график в PNG">⤓</button>
      <button id="d-close" class="ghost">✕</button>
    </div>
  </div>
  <div id="chart"><canvas id="heat"></canvas><div id="zone-tip" class="zone-tip" hidden></div></div>
  <div id="pop" class="pop" hidden></div>
  <div id="legend" class="legend"></div>
  <div id="d-body"></div>
</aside>
<footer>Механические правила и их измеренная статистика, не инвестиционные рекомендации.</footer>
<script src="/static/app.js"></script>
</body>
</html>
